<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---------- RNG / 수학

function G(o){const W=o.w,H=o.h,L=o.l??60,R=o.r??20,T=o.t??34,B=o.b??44,pw=W-L-R,ph=H-T-B,s=[];

rect:(x0,x1,y0,y1,c,op=1)=>A(`<rect x="${Math.min(X(x0),X(x1))}" y="${Math.min(Y(y0),Y(y1))}" width="${Math.abs(X(x1)-X(x0))}" height="${Math.abs(Y(y1)-Y(y0))}" fill="${c}" fill-opacity="${op}"/>`),

sq:(x,y)=>A(`<rect x="${X(x)-3.5}" y="${Y(y)-3.5}" width="7" height="7"/>`),

out:()=>{let h=`<g transform="translate(${o.ox||0},0)"><line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="#000"/><line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="#000"/>`;

const SV=(W,H,...gs)=>`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" font-family="inherit">${gs.map(x=>typeof x=='string'?x:x.out()).join('')}</svg>`;
const yt=(labs)=>labs.map((l,j)=>[labs.length-1-j,l]);
function hemi(ox,w,h,counts,cols,Tt){const Nn=Math.round(sum(counts));let s='';if(Nn>0){const rows=Math.max(2,Math.round(Math.sqrt(Nn/3.5))),radii=Array.from({length:rows},(_,i)=>.45+.55*i/(rows-1)),rs=sum(radii),per=radii.map(r=>Math.round(r/rs*Nn));per[rows-1]+=Nn-sum(per);let pts=[];radii.forEach((r,i)=>{const n=per[i];for(let k=0;k<n;k++)pts.push([n>1?Math.PI-Math.PI*k/(n-1):Math.PI/2,r])});pts.sort((a,b)=>b[0]-a[0]);

pts.forEach(([a,r],i)=>s+=`<circle cx="${cx+r*Math.cos(a)*S}" cy="${by-r*Math.sin(a)*S}" r="${rad}" fill="${cc[i]||'#ccc'}"/>`);s+=`<text x="${cx}" y="${by-4}" text-anchor="middle" font-size="16">${Nn}석</text>`}

function RowTable(cols,rows){const el=document.createElement('div'),tb=document.createElement('table');
tb.innerHTML='<tr>'+cols.map(c=>`<th>${c[0]}</th>`).join('')+'<th></th></tr>';el.append(tb);
const add=v=>{v=v||cols.map(c=>c[2]=='str'?'새 항목':c[2]=='bool'?true:20);const tr=document.createElement('tr');
cols.forEach((c,j)=>{const td=document.createElement('td');td.innerHTML=c[2]=='bool'?`<input type="checkbox" ${v[j]?'checked':''}>`:`<input type="text" size="${c[1]}" style="width:${c[1]*9+10}px" value="${v[j]}">`;tr.append(td)});

rows.forEach(add);const ab=document.createElement('button');ab.textContent='+ 행 추가';ab.onclick=()=>add();ab.style.margin='4px 0';el.append(ab);
el.get=()=>[...tb.rows].slice(1).map(tr=>cols.map((c,j)=>{const i=tr.cells[j].firstChild,raw=c[2]=='bool'?i.checked:i.value;
try{if(c[2]=='str')return raw.trim();if(c[2]=='bool')return raw;if(c[2]=='int'){const x=Number(String(raw).replace(/[,_]/g,''));if(String(raw).trim()===''||isNaN(x))throw 0;return Math.trunc(x)}const x=Number(raw);if(String(raw).trim()===''||isNaN(x))throw 0;return x}catch{throw Error(`'${c[0]}' 값이 올바르지 않습니다: '${raw}'`)}}));return el}

function build(m,idx){const A=document.createElement('div');A.className='app';A.innerHTML=`<div class="left"><div class="tabs"></div><div class="panes" style="flex:1;display:flex;flex-direction:column;min-height:0"></div><button class="go">▶ 선거 시작</button><progress max="1" value="0"></progress><div class="st">대기 중 (처음엔 '인구 배율'을 0.1로 해서 빠르게 시험해 보세요)</div></div><div class="right"><div class="tabs"></div><div class="panes" style="flex:1;display:flex;flex-direction:column;min-height:0"></div></div>`;
$('#apps').append(A);const [L,Rt]=A.children,sw=(root,i)=>{[...$('.tabs',root).children].forEach((b,j)=>b.classList.toggle('on',i==j));[...$('.panes',root).children].forEach((p,j)=>p.classList.toggle('on',i==j))};

const pp=document.createElement('div');pp.className='pt';m.inp={};m.P.forEach(([k,l,d])=>{const lb=document.createElement('label');lb.textContent=l;const i=document.createElement('input');i.type='text';i.value=d;m.inp[k]=i;pp.append(lb,i)});addTab(L,'변수',pp);
m.tb=m.T.map(t=>{const p=document.createElement('div');p.innerHTML=`<div>${t.hint.replace(/\n/g,'<br>')}</div>`;const r=RowTable(t.cols,t.rows);p.append(r);addTab(L,t.tab,p);return r});

const stop=()=>{if(m.job){clearTimeout(m.job);m.job=null}m.pl.textContent='▶ 재생'},draw=k=>{if(m.R)m.drawCount(+k);};

const PP=[["SEED","난수 시드 (비우면 무작위)","","seed"],["SCALE","인구 배율 (작을수록 빠름)","1.0","f"],["VOTER_SD","유권자 이념 표준편차","10.0","f"],["DISTRICT_BIAS","투표구 편향 ±","4","int"],["EXTREME_WEIGHT","극단성 페널티","15.0","f"],["CONFLICT_RELIEF","갈등 완화 비율","0.5","f"],["TURNOUT_DECAY","투표율 감쇠","30.0","f"],["MIN_TURNOUT","최소 투표 확률","0.00","f"],["EXIT_POLL_INTERVAL","출구조사 간격(명당 1명)","10000","int"],["EXIT_POLL_SIMS","출구조사 시뮬 횟수","5000","int"],["CI_LOW","신뢰구간 하한(%)","2.5","f"],["CI_HIGH","신뢰구간 상한(%)","97.5","f"],["COUNT_STEP","개표 속보 간격(%)","10","int"],["COUNT_ORDER","개표 순서 (random/sequential)","random","str"],["COUNT_DELAY","재생 간격(초)","0.7","f"]];
const REG1=[["서울",17,20,6,9274392,480],["부산",31,30,5,3226446,180],["대구",35,34,4,2345185,120],["인천",15,16,6,3070203,140],["광주",6,8,3,1382316,80],["대전",18,20,5,1443171,70],["울산",27,26,6,1085888,60],["세종",14,18,4,390618,20],["경기",16,18,6,13780735,600],["강원",28,26,4,1506690,80],["충청",22,22,5,3742660,190],["전라",10,9,3,3485763,200],["경상",31,29,5,5679098,290],["제주",16,17,5,662117,30]];
const REG2=REG1.map((r,i)=>[...r.slice(0,5),[48,18,12,14,8,7,6,2,60,8,19,20,29,3][i]]);
const regCols=(l)=>[["이름",7,"str"],["사회",4,"float"],["경제",4,"float"],["갈등",4,"float"],["인구",11,"int"],[l,6,"int"]];
async function runPres(P,C,Rg,prog){rnd=mk(P.SEED);const n=C.length,names=C.map(c=>c[0]),CS=C.map(c=>c[1]),CE=C.map(c=>c[2]),RUN=C.map(c=>!!c[3]);
if(!RUN.some(x=>x))throw Error('출마한 후보가 한 명도 없습니다.');const EXT=CS.map((s,i)=>Math.hypot(s-20,CE[i]-20)/Math.hypot(20,20)),nD=sum(Rg.map(r=>r[5])),iv=P.EXIT_POLL_INTERVAL,run=[...RUN.keys()].filter(i=>RUN[i]);

for(let v=0;v<V;v++){const s=clip(ls+P.VOTER_SD*nrm(),0,40),e=clip(le+P.VOTER_SD*nrm(),0,40);let b=0,mn=Infinity;for(const j of run){const d=Math.hypot(s-CS[j],e-CE[j])+pen[j];if(d<mn){mn=d;b=j}}

const ballots=[],dReg=[],dPop=[],dLab=[],exR=Rg.map(()=>new Array(n).fill(0));let done=0;
for(let ri=0;ri<Rg.length;ri++){const[name,as,ae,cf,pop,ds]=Rg[ri],vpd=Math.max(Math.floor(pop/ds),1);
for(let k=0;k<ds;k++){const bs=rint(-P.DISTRICT_BIAS,P.DISTRICT_BIAS+1),be=rint(-P.DISTRICT_BIAS,P.DISTRICT_BIAS+1),[ch,ex]=sim(clip(as+bs,0,40),clip(ae+be,0,40),vpd,cf);
ballots.push(ch);dReg.push(ri);dPop.push(vpd);dLab.push(`${name} ${k+1}번 투표구`);ex.forEach((x,i)=>exR[ri][i]+=x);done++;if(done%25==0||done==nD)await prog(done/nD*.9,`투표 진행 중... ${name} (${done}/${nD})`)}}
